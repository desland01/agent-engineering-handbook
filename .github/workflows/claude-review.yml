# Claude reviews each pull request and posts its findings as inline comments.
#
# Authentication is your Claude subscription, not an API key: run `claude setup-token`
# locally and store the result as the CLAUDE_CODE_OAUTH_TOKEN repository secret. Runs
# draw on your plan's quota. The first step checks the secret exists so the workflow
# stays green, rather than failing red, until it is set.
#
# This is judgment, not a gate. The deterministic gate is checks.yml.
name: Claude review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review the diff
    runs-on: ubuntu-latest
    steps:
      - name: Is the subscription token set
        id: guard
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo 'ready=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=no' >> "$GITHUB_OUTPUT"
            echo 'CLAUDE_CODE_OAUTH_TOKEN is not set; skipping the review.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Run `claude setup-token`, then `gh secret set CLAUDE_CODE_OAUTH_TOKEN`.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v6
        if: steps.guard.outputs.ready == 'yes'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.ready == 'yes'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Skill must be listed: --allowedTools replaces the whole allowed set, so naming
          # only the comment tool denied the review skill itself.
          claude_args: '--allowedTools "Skill,mcp__github_inline_comment__create_inline_comment"'
