name: Handbook freshness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r build/requirements.txt
      - run: python build/render.py
      - run: python build/check.py
      - name: Check committed pages match sources
        run: |
          changes="$(git status --porcelain --untracked-files=all -- public)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo 'Regenerate public/ and commit the result.'
            exit 1
          fi
